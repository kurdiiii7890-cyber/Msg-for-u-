<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little Message</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Patrick+Hand&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --paper-bg: #13151e;
      --paper-border: rgba(255, 255, 255, 0.08);
      --paper-line: rgba(255, 255, 255, 0.045);
      --margin-line: rgba(244, 63, 94, 0.35);
      --ink-color: #f1f5f9;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --accent-color: #818cf8;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start; /* محاذاة للأعلى لمنع قفز الصفحة */
      padding: 40px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* جزيئات النجوم في الخلفية */
    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow {
      position: fixed;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(168, 85, 247, 0.04) 45%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      position: relative;
      z-index: 10;
      margin: auto 0;
    }

    /* انتقال الصفحات */
    .screen {
      width: 100%;
      display: none;
      opacity: 0;
      transform: scale(0.96) translateY(18px);
      filter: blur(5px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0);
    }

    .screen.fade-out {
      opacity: 0;
      transform: scale(0.95) translateY(-14px);
      filter: blur(8px);
    }

    /* الشاشة الأولى: المقدمة */
    #screen-intro {
      text-align: center;
      padding: 50px 32px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6),
                  0 0 1px 1px var(--card-border),
                  0 0 35px -5px var(--accent-glow);
      border: 1px solid var(--card-border);
    }

    .envelope-icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      animation: gentleFloat 4s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }

    .envelope-icon {
      width: 32px;
      height: 32px;
      color: var(--accent-color);
      filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.4));
    }

    .intro-text-wrapper {
      min-height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 34px;
      padding: 0 10px;
    }

    .intro-text {
      font-size: 1.38rem;
      font-weight: 400;
      line-height: 1.65;
      color: #f8fafc;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .intro-word {
      display: inline-block;
      opacity: 0;
      filter: blur(10px);
      transform: translateY(6px);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      margin-right: 0.28em;
      will-change: opacity, filter, transform;
    }

    .intro-word.revealed {
      opacity: 1;
      filter: blur(0px);
      transform: translateY(0);
    }

    .buttons-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .buttons-group.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .action-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 500;
      padding: 13px 28px;
      border-radius: 9999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      position: relative;
      overflow: hidden;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 15px rgba(129, 140, 248, 0.2);
    }

    .action-btn:active {
      transform: translateY(-1px) scale(0.98);
    }

    /* الشاشة الثانية: ورقة الدفتر */
    #screen-letter {
      position: relative;
    }

    .paper-sheet {
      position: relative;
      width: 100%;
      background-color: var(--paper-bg);
      background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 24px 24px;
      border-radius: 6px;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.8),
        0 0 0 1px var(--paper-border),
        0 0 40px -10px rgba(99, 102, 241, 0.12);
      padding: 56px 38px 60px 52px;
      overflow: hidden;
      transform: rotate(-0.3deg);
      border: 1px solid var(--paper-border);
      transition: transform 0.4s ease;
    }

    .washi-tape {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%) rotate(1.1deg);
      width: 140px;
      height: 34px;
      background: rgba(45, 49, 66, 0.65);
      backdrop-filter: blur(6px);
      border-left: 2px dashed rgba(255, 255, 255, 0.2);
      border-right: 2px dashed rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      z-index: 5;
    }

    .paper-margin-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 44px;
      width: 1.5px;
      background-color: var(--margin-line);
      box-shadow: 0 0 6px rgba(244, 63, 94, 0.2);
    }

    .paper-content {
      position: relative;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 37px,
        var(--paper-line) 37px,
        var(--paper-line) 38px
      );
      background-position: 0 18px;
      line-height: 38px;
      min-height: 420px;
      padding-left: 16px;
    }

    .letter-paragraph {
      margin-bottom: 28px;
    }

    .letter-paragraph:last-child {
      margin-bottom: 0;
    }

    /* أنيميشن الضبابية كلمة بكلمة */
    .blur-word {
      display: inline-block;
      font-family: 'Caveat', 'Patrick Hand', 'Segoe Print', 'Bradley Hand', cursive;
      font-size: 1.76rem;
      font-weight: 600;
      color: var(--ink-color);
      letter-spacing: 0.02em;
      text-shadow: 0 0 1px rgba(255, 255, 255, 0.4), 0 1px 2px rgba(0,0,0,0.5);
      margin-right: 0.32em;
      opacity: 0;
      filter: blur(10px);
      transform: translateY(5px);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, filter, transform;
    }

    .blur-word.revealed {
      opacity: 1;
      filter: blur(0px);
      transform: translateY(0);
    }

    .heart-end {
      display: inline-block;
      color: #fb7185;
      font-size: 1.5rem;
      opacity: 0;
      filter: blur(8px);
      transform: scale(0.6);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin-left: 8px;
      text-shadow: 0 0 12px rgba(251, 113, 133, 0.6);
      vertical-align: middle;
    }

    .heart-end.show {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1);
      animation: heartbeat 1.6s ease-in-out infinite 0.5s;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.22); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }

    .controls-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 18px;
      padding: 0 4px;
    }

    .subtle-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 7px 15px;
      border-radius: 9999px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(6px);
    }

    .subtle-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #f1f5f9;
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .subtle-btn:active {
      transform: scale(0.96);
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 12px;
      }
      #screen-intro {
        padding: 38px 20px;
        border-radius: 20px;
      }
      .intro-text {
        font-size: 1.18rem;
      }
      .paper-sheet {
        padding: 42px 18px 46px 28px;
      }
      .paper-margin-line {
        left: 24px;
      }
      .paper-content {
        padding-left: 10px;
        line-height: 33px;
        background-image: repeating-linear-gradient(
          transparent,
          transparent 32px,
          var(--paper-line) 32px,
          var(--paper-line) 33px
        );
      }
      .blur-word {
        font-size: 1.4rem;
        margin-right: 0.28em;
      }
      .action-btn {
        width: 100%;
        text-align: center;
        padding: 12px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- كانفاس النجوم -->
  <canvas id="stars-canvas"></canvas>
  <div class="bg-glow"></div>

  <div class="app-container">

    <!-- الشاشة الأولى -->
    <main id="screen-intro" class="screen active">
      <div class="envelope-icon-wrap">
        <svg class="envelope-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.2 8.4c.5.38.8.97.8 1.6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 .8-1.6l8-6a2 2 0 0 1 2.4 0l8 6Z" />
          <path d="m22 10-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 10" />
        </svg>
      </div>

      <div class="intro-text-wrapper">
        <p class="intro-text" id="intro-container"></p>
      </div>

      <div id="buttons-group" class="buttons-group">
        <button class="action-btn" id="btn-ok">(ok?)</button>
        <button class="action-btn" id="btn-weird">( don't be weird )</button>
      </div>
    </main>

    <!-- الشاشة الثانية: ورقة الرسالة -->
    <main id="screen-letter" class="screen">
      <div class="paper-sheet" id="paper-element">
        <div class="washi-tape"></div>
        <div class="paper-margin-line"></div>
        <div class="paper-content" id="letter-content">
          <!-- بناء الفقرات والكلمات عبر JS -->
        </div>
      </div>

      <div class="controls-bar">
        <button id="btn-skip" class="subtle-btn" title="Skip animation">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
          Skip animation
        </button>
        <button id="btn-replay" class="subtle-btn" style="display:none;" title="Replay">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
          Replay
        </button>
      </div>
    </main>

  </div>

  <script>
    // 1. تشغيل جزيئات النجوم في الخلفية
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class StarParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.5 + 0.5;
        this.baseAlpha = Math.random() * 0.45 + 0.15;
        this.alpha = this.baseAlpha;
        this.speedY = -(Math.random() * 0.22 + 0.05);
        this.twinkleSpeed = Math.random() * 0.02 + 0.008;
        this.twinkleVal = Math.random() * Math.PI * 2;
      }
      update() {
        this.y += this.speedY;
        this.twinkleVal += this.twinkleSpeed;
        this.alpha = this.baseAlpha + Math.sin(this.twinkleVal) * 0.2;
        if (this.y < -10) {
          this.y = canvas.height + 10;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(224, 231, 255, ${Math.max(0, this.alpha)})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const particleCount = Math.min(55, Math.floor(window.innerWidth / 16));
    for (let i = 0; i < particleCount; i++) {
      particles.push(new StarParticle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let p of particles) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // 2. النصوص
    const introSentence = "Hello, today there's no questions or anything only little message from me";

    const letterParagraphs = [
      "So i been through a-lot this year…i failed in high school and my grandpa died and my hair got Alopecia ( that weird spot in the back ) but i'm not here to play victim i know u have more problems than me , I'm writing this message just to thank u cuz u were with me and u asked me how i was and u didn't got mad or bothered cuz of my weird messages and I'm sorry cuz i texted ur friend that time i'm still embarrassed tbh so yeah I'm thankful for all of it ur so sweet and kind",
      "Also i wanna thank u for ur likes to my comments and stories maybe to u it's nothing but it's a big thing for me it's like i exist and there's actually someone who care , u make me feel i'm alive",
      "Thx sorry it's long message i know but yeah. U don't have to reply or anything"
    ];

    // العناصر
    const screenIntro = document.getElementById("screen-intro");
    const screenLetter = document.getElementById("screen-letter");
    const introContainer = document.getElementById("intro-container");
    const buttonsGroup = document.getElementById("buttons-group");
    const btnOk = document.getElementById("btn-ok");
    const btnWeird = document.getElementById("btn-weird");
    const letterContent = document.getElementById("letter-content");
    const btnSkip = document.getElementById("btn-skip");
    const btnReplay = document.getElementById("btn-replay");

    let animationTimeouts = [];
    let isRevealing = false;

    // 3. أنيميشن المقدمة: كلمة بكلمة
    function setupAndAnimateIntro() {
      introContainer.innerHTML = "";
      const words = introSentence.split(" ");
      const spanElements = [];

      words.forEach(wordText => {
        const span = document.createElement("span");
        span.className = "intro-word";
        span.textContent = wordText;
        introContainer.appendChild(span);
        spanElements.push(span);
      });

      spanElements.forEach((span, idx) => {
        setTimeout(() => {
          span.classList.add("revealed");
          if (idx === spanElements.length - 1) {
            setTimeout(() => {
              buttonsGroup.classList.add("visible");
            }, 350);
          }
        }, idx * 110 + 300);
      });
    }

    // 4. بناء الرسالة وأنيميشن الضبابية كلمة بكلمة
    let letterWordElements = [];
    let heartElement = null;

    function buildLetterDOM() {
      letterContent.innerHTML = "";
      letterWordElements = [];

      letterParagraphs.forEach((paragraphText, pIndex) => {
        const pEl = document.createElement("p");
        pEl.className = "letter-paragraph";

        const words = paragraphText.split(" ");
        words.forEach(wordText => {
          const span = document.createElement("span");
          span.className = "blur-word";
          span.textContent = wordText;
          pEl.appendChild(span);
          letterWordElements.push(span);
        });

        if (pIndex === letterParagraphs.length - 1) {
          heartElement = document.createElement("span");
          heartElement.id = "heart-icon";
          heartElement.className = "heart-end";
          heartElement.textContent = "♥";
          pEl.appendChild(heartElement);
        }

        letterContent.appendChild(pEl);
      });
    }

    function startWordBlurAnimation() {
      clearAllTimeouts();
      buildLetterDOM();

      btnSkip.style.display = "inline-flex";
      btnReplay.style.display = "none";
      isRevealing = true;

      let cumulativeDelay = 150;

      letterWordElements.forEach((wordSpan, index) => {
        const text = wordSpan.textContent;
        let wordDelay = 80;

        if (text.includes("…") || text.includes(".")) {
          wordDelay = 220;
        } else if (text.includes(",")) {
          wordDelay = 130;
        }

        cumulativeDelay += wordDelay;

        const timeout = setTimeout(() => {
          if (!isRevealing) return;
          wordSpan.classList.add("revealed");

          // إظهار القلب بعد آخر كلمة
          if (index === letterWordElements.length - 1) {
            const heartTimeout = setTimeout(() => {
              if (heartElement) heartElement.classList.add("show");
              finishRevealing();
            }, 300);
            animationTimeouts.push(heartTimeout);
          }
        }, cumulativeDelay);

        animationTimeouts.push(timeout);
      });
    }

    function clearAllTimeouts() {
      animationTimeouts.forEach(t => clearTimeout(t));
      animationTimeouts = [];
    }

    function finishRevealing() {
      isRevealing = false;
      clearAllTimeouts();

      letterWordElements.forEach(span => {
        span.classList.add("revealed");
      });

      if (heartElement) heartElement.classList.add("show");

      btnSkip.style.display = "none";
      btnReplay.style.display = "inline-flex";
    }

    // 5. التنقل وأحداث الأزرار
    function goToLetter() {
      screenIntro.classList.add("fade-out");
      setTimeout(() => {
        screenIntro.classList.remove("active", "fade-out");
        screenIntro.style.display = "none";
        // التثبيت في أعلى الورقة دائماً لمنع النزول لأسفل
        window.scrollTo({ top: 0, behavior: 'instant' });
        screenLetter.classList.add("active");
        setTimeout(startWordBlurAnimation, 250);
      }, 550);
    }

    btnOk.addEventListener("click", goToLetter);
    btnWeird.addEventListener("click", goToLetter);
    btnSkip.addEventListener("click", finishRevealing);
    btnReplay.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      startWordBlurAnimation();
    });

    // البدء عند فتح الصفحة
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(setupAndAnimateIntro, 350);
    });
  </script>
</body>
</html>
